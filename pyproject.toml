    "arxiv==4.0.2",
    "bitsandbytes>=0.50.2",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "colorama==0.4.6",
    "flatbuffers==25.12.19",
    "idna==3.20",
    "lxml==6.1.3",
    "networkx==3.7",
    "numpy==2.5.4",
    "onnxruntime==1.32.0",
    "packaging==26.3",
    "protobuf==7.36.2",
    "psutil==7.2.2",
    "pydantic==2.14.3",
    "pydantic-core==2.50.4",
    "pymupdf==2.1",
    "pymupdf-layout==2.1",
    "pymupdf4llm==2.1",
    "pypdf>=7.1.0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "requests==2.34.2",
    "sentence-transformers>=6.3.0",
    "tabulate==0.10.0",
    "torch>=2.15.0",
    "tqdm==4.70.1",
    "transformers>=5.23.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.5",
    "urllib3==2.8.0",
