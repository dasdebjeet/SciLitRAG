
# SciLitRAG vector database service.
# Qdrant data is persisted in a named Docker volume so that
# container recreation does not erase the indexed research papers.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: scilitrag-qdrant
    restart: unless-stopped

    ports:
      # REST API and dashboard.
      - "6333:6333"

      # gRPC API.
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "bash -c '</dev/tcp/127.0.0.1/6333'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
    name: scilitrag_qdrant_storage
